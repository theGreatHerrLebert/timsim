[workspace]
members = [
    "timsim-types",
    "timsim-schema",
    "timsim-chem",
    "timsim-core",
]
resolver = "2"

# NO `[patch.crates-io]` here, deliberately.
#
# Every foundation crate this workspace depends on (ms-chem, mscore, ms-io) and every crate it
# publishes (timsim-types, timsim-schema, timsim-chem, timsim-core) is live on crates.io, so a
# plain `git clone && cargo build` resolves from the registry with no sibling checkouts.
#
# A committed `[patch.crates-io]` pointing at `../mscore/*` would make that clone FAIL for anyone
# who does not happen to have the foundation repo checked out next to this one — the patch is a
# local-development convenience, not a build requirement, and a convenience must never be a
# precondition.
#
# Working on the foundation crates and this workspace at the same time? Put the patch in a
# git-ignored `.cargo/config.toml` at the repo root (cargo honours `[patch]` there exactly as it
# does in a manifest). See README.md -> "Local development against the foundation crates".
